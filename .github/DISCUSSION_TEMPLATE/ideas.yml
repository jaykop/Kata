title: "[아이디어] "
body:
  - type: markdown
    attributes:
      value: |
        할 일로 확정하지 않아 중요도·규모를 매길 수 없는 아이디어를 둔다. 확정하면 이 Discussion에서 이슈를 만든다.
        공개 저장소다. 로컬 경로, 개인 설정, 세션 메모는 적지 않는다.
  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 어떤 불편이나 한계에서 나온 아이디어인가.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 아이디어
      description: 무엇을 어떻게 바꾸면 좋을지. 설계 상세는 확정 뒤 plan에 쓴다.
    validations:
      required: true
  - type: dropdown
    id: plugin
    attributes:
      label: 대상 플러그인
      multiple: true
      options:
        - kata
        - targeting
        - ai
        - camera
        - framework
        - world
        - 샘플·도구
  - type: textarea
    id: open-questions
    attributes:
      label: 미확정 사항
      description: 이슈로 만들기 전에 정해야 할 것.
